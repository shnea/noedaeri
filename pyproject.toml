[project]
name = "noedaeri"
version = "0.1.0"
description = "Native compute job service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "python-dotenv==1.2.4",
  "pillow==12.3.0",
  "pillow-heif==1.8.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
